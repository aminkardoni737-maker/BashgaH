<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>برنامه فوتبال و باشگاه</title>
<style>
@font-face{font-family:"B Titr";src:local("B Titr"),local("BTitr"),local("B-Titr"),local("BTitrBold"),url("BTitr.woff2") format("woff2"),url("BTitr.ttf") format("truetype");font-display:swap}
:root{--bg:#000000;--s1:#101010;--s2:#1a1a1a;--tx:#F5F5F0;--mut:#9A9A94;--line:rgba(255,255,255,.18);--yel:#F4C430;--red:#FF6B6F;--on-yel:#1A1403;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Arabic","Vazirmatn",Tahoma,sans-serif;font-size:16px;line-height:1.7}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--yel);outline-offset:2px}
#view{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:16px 16px calc(92px + env(safe-area-inset-bottom))}
h1{font-size:26px;line-height:1.3;margin:4px 0 6px;font-weight:800}
h2{font-size:20px;margin:0;font-weight:800}
h3{font-size:16px;margin:0 0 8px;font-weight:700}
p{margin:0}
.mut{color:var(--mut);font-size:14px;margin-bottom:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.mon{font-size:22px;font-weight:800}
.nav{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;font-size:26px;line-height:1;display:grid;place-items:center}
.legend{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.today-btn{margin-inline-start:auto;font-size:14px;color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:0 16px;min-height:40px}
.dow,.grid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:13px;color:var(--mut);padding:2px 0 4px}
.grid{border-top:1px solid var(--line);border-inline-start:1px solid var(--line)}
.cell{position:relative;min-height:56px;border-inline-end:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600}
.cell.empty{background:transparent}
.cell .n{min-width:26px;text-align:center;line-height:26px;font-size:16px}
.cell.today .n{outline:2px solid var(--yel);outline-offset:1px;border-radius:50%}
.cell.sel{background:var(--tx);color:var(--bg)}
.mk{height:12px;display:flex;gap:3px;align-items:center;font-size:11px;line-height:1}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid currentColor}
.dot.f{background:currentColor}
.sq{display:inline-block;width:8px;height:11px;background:var(--yel);border-radius:1px;box-shadow:0 0 0 1px rgba(0,0,0,.35)}
.hero{position:relative;overflow:hidden;border-radius:18px;background:rgba(16,16,16,.55);border:1px solid var(--line);padding:18px;margin-top:18px;display:flex;align-items:flex-end;gap:16px;min-height:132px}
.pitch{position:absolute;inset:0;width:100%;height:100%;color:var(--tx);opacity:.2;fill:none;stroke:currentColor;stroke-width:1.5}
.num{position:relative;font-size:76px;font-weight:800;line-height:.95}
.hmeta{position:relative;display:flex;flex-direction:column;gap:2px;padding-bottom:4px}
.hmeta b{font-size:20px}
.hmeta span{color:var(--mut);font-size:14px}
.hmeta .wk{margin-top:6px;align-self:flex-start;background:var(--yel);color:var(--on-yel);border-radius:999px;padding:0 10px;font-size:13px;font-weight:700}
.seg{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:14px 0}
.seg button{padding:8px 4px;min-height:46px;font-size:14px;font-weight:600;border-inline-start:1px solid var(--line)}
.seg button:first-child{border-inline-start:0}
.seg button[aria-pressed=true]{background:var(--tx);color:var(--bg)}
.sub{color:var(--mut);font-size:14px}
.note{margin-top:8px;font-size:14px;padding:8px 12px;border-inline-start:3px solid var(--yel);background:var(--s1)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:var(--yel)}
.exl{list-style:none;margin:10px 0 0;padding:0}
.ex{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.chk{flex:none;width:40px;height:40px;border-radius:50%;border:2px solid var(--tx);display:grid;place-items:center;font-size:20px;line-height:1;color:transparent}
.ex.on .chk{background:var(--tx);color:var(--bg)}
.ex.on .exn{color:var(--mut);text-decoration:line-through}
.exb{flex:1;min-width:0}
.exn{font-weight:700}
.exs{color:var(--mut);font-size:14px}
.wt{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;color:var(--mut)}
input[type=text],input[type=date],input[type=time],textarea{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px}
.wt input{width:76px;min-height:38px;padding:4px 8px;text-align:center;color:var(--tx)}
textarea{width:100%;min-height:76px;resize:vertical}
.red{margin-top:18px;border:1px solid var(--red);border-radius:12px;padding:14px}
.red h3{display:flex;align-items:center;gap:10px;color:var(--red)}
.cardico{display:inline-block;width:13px;height:19px;background:var(--red);border-radius:2px;transform:rotate(8deg)}
.red ul{margin:0 0 12px;padding-inline-start:20px;font-size:15px}
.red li{margin-bottom:2px}
.btn{min-height:46px;border-radius:12px;padding:0 18px;font-weight:700;background:var(--yel);color:var(--on-yel)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
.btn.on{background:var(--tx);color:var(--bg)}
.btn.danger{background:transparent;border:1px solid var(--red);color:var(--red)}
.link{color:var(--tx);text-decoration:underline;text-underline-offset:4px;min-height:44px;font-size:15px}
.sec{margin-top:22px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:6px}
.stat{border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:28px;line-height:1.2}
.stat span{font-size:13px;color:var(--mut)}
.meal{padding:10px 0;border-top:1px solid var(--line)}
.meal b{display:block}
.meal span{color:var(--mut);font-size:15px}
.fld{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
.wl{list-style:none;padding:0;margin:8px 0 0}
.wl li{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.x{width:44px;height:44px;color:var(--mut);font-size:20px}
.chart{width:100%;height:auto;direction:ltr;color:var(--tx)}
#tabs{position:fixed;z-index:3;inset-inline:0;bottom:0;display:grid;grid-template-columns:repeat(6,1fr);background:var(--s1);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{min-height:60px;font-size:12px;font-weight:600;color:var(--mut);border-top:3px solid transparent}
#tabs button[aria-current=page]{color:var(--tx);border-top-color:var(--yel)}
#toast{position:fixed;z-index:5;top:14px;inset-inline:16px;margin:auto;max-width:420px;background:var(--tx);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;font-weight:600;text-align:center;opacity:0;pointer-events:none}
#toast.show{opacity:1}
@media (prefers-reduced-motion:no-preference){#toast{transition:opacity .2s}.bar i{transition:width .25s}}
.bg7{position:fixed;inset:0;margin:auto;z-index:0;width:min(100vw,560px);height:100vh;pointer-events:none}
.bg7 path{fill:rgba(255,255,255,.05);stroke:rgba(255,255,255,.12);stroke-width:1.2;stroke-linejoin:round}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.imgs.one{grid-template-columns:1fr;max-width:55%}
.lnks{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:6px}
.imgs svg{min-height:120px}
.imgs figure{margin:0;border:1px solid var(--line);border-radius:10px;padding:4px;background:rgba(255,255,255,.03)}
.imgs figcaption{text-align:center;font-size:12px;color:var(--mut)}
.imgs svg{width:100%;height:auto;display:block;color:var(--tx)}
.badon{background:var(--red);color:#1a0505;border-color:var(--red)}
.badnum{color:var(--red)}
.exb .link{display:inline-block;margin-top:2px}
.sug{margin-top:6px;font-size:14px}
.sug b{font-size:16px}
.up{color:var(--yel);font-weight:700}
.note.up{border-inline-start-color:var(--yel);background:var(--s2);color:var(--tx)}
.sug .link{min-height:36px;font-size:14px;margin-inline-start:6px}
.rem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.rem input{width:140px;text-align:center;color:var(--tx)}
.wd{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:12px}
.wd.td{border-color:var(--yel)}
.wh{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;text-align:start;min-height:44px}
.wh b{font-size:16px}.wh span{color:var(--mut);font-size:13px}
.wi{list-style:none;margin:8px 0 0;padding:0}
.wi li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.wi li span{color:var(--mut);white-space:nowrap}
.help{margin-top:10px;font-size:14px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--s1)}
.mh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mh small{color:var(--mut);font-size:12px}
.fi{display:block;width:100%;text-align:start;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:1.7;min-height:40px}
.fi[aria-expanded=true]{border-color:var(--yel)}
.fi.alt{border-style:dashed;color:var(--mut)}
.fd{margin:0 0 6px;padding:8px 10px;border-radius:10px;background:var(--s2);font-size:13px;line-height:1.8}
.fd .ln{display:flex;justify-content:space-between;gap:8px}
.fd .nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0;text-align:center}
.fd .nums div{border:1px solid var(--line);border-radius:8px;padding:4px 2px}
.fd .nums b{display:block;font-size:16px}
.fd .nums span{font-size:11px;color:var(--mut)}
.chat{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.msg{border-radius:14px;padding:10px 12px;line-height:1.9;font-size:15px}
.msg.u{background:var(--s2);align-self:flex-start;max-width:92%}
.msg.a{border:1px solid var(--line)}
.msg p{margin:6px 0}
.ac{border-top:1px solid var(--line);padding:8px 0}
.ac:first-of-type{border-top:0}
.ah{display:flex;justify-content:space-between;align-items:center;gap:8px}
.vb{font-size:12px;border-radius:10px;padding:1px 8px;color:#000;white-space:nowrap}
.vb.good{background:#6DD58C}.vb.mid{background:var(--yel)}.vb.bad{background:#FF6B6F}
.am{font-size:13px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chips button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;min-height:40px;font-size:14px}
.askrow{display:flex;gap:8px;margin-top:8px}
.askrow input{flex:1;min-width:0}
.pfl{display:block;margin:12px 0 6px;font-weight:600}
.pfg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pfg label{font-size:13px;color:var(--mut)}
.pfg input{width:100%;margin-top:4px;color:var(--tx);background:var(--s1);text-align:center;font-size:16px}
.fk{display:block;color:var(--yel);font-size:12.5px;line-height:1.6;margin-top:2px}
.askrow{position:sticky;bottom:calc(68px + env(safe-area-inset-bottom));background:var(--bg);padding:8px 0;z-index:2}
</style>
</head>
<body>
<svg class="bg7" viewBox="0 0 100 130" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M10 12 H92 V30 L50 122 H28 L68 32 H10 Z"/></svg>
<main id="view"></main>
<nav id="tabs" aria-label="بخش‌های برنامه">
  <button data-act="tab" data-v="cal">تقویم</button>
  <button data-act="tab" data-v="week">هفته</button>
  <button data-act="tab" data-v="food">غذا</button>
  <button data-act="tab" data-v="ask">دستیار</button>
  <button data-act="tab" data-v="prog">گزارش</button>
  <button data-act="tab" data-v="set">تنظیمات</button>
</nav>
<div id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept=".json,application/json" hidden data-act="file">
<script>
(function(){
'use strict';
var KEY='fb-gym-v1';
var FAD='۰۱۲۳۴۵۶۷۸۹';
var fa=function(n){return String(n).replace(/\d/g,function(d){return FAD[d]})};
var norm=function(s){return String(s).replace(/[۰-۹]/g,function(c){return FAD.indexOf(c)}).replace(/[٠-٩]/g,function(c){return '٠١٢٣٤٥٦٧٨٩'.indexOf(c)}).replace(/[٫,،]/g,'.').trim()};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var WD=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
var WDS=['ش','ی','د','س','چ','پ','ج'];

/* ---------- storage ---------- */
var SNAPK='fb-gym-snaps';
async function kget(k){
  try{ if(window.storage){var r=await window.storage.get(k,false); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
  try{ var v=localStorage.getItem(k); if(v) return JSON.parse(v); }catch(e){}
  return null;
}
async function kset(k,o){
  var v=JSON.stringify(o);
  try{ if(window.storage){ await window.storage.set(k,v,false); return; } }catch(e){}
  try{ localStorage.setItem(k,v); }catch(e){}
}
var Store={load:function(){return kget(KEY)},save:function(x){return kset(KEY,x)}};
var snaps=[];
function takeSnap(){
  var t=iso(todayD()),json=JSON.stringify(S),i;
  for(i=0;i<snaps.length;i++){if(snaps[i].d===t&&!snaps[i].tag){snaps[i].json=json;kset(SNAPK,snaps);return}}
  snaps.push({d:t,json:json});snaps=snaps.slice(-8);kset(SNAPK,snaps);
}

/* ---------- dates ---------- */
var pad=function(n){return String(n).padStart(2,'0')};
var iso=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2],12)};
var addDays=function(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x};
var wdIdx=function(d){return (d.getDay()+1)%7};
var todayD=function(){var t=new Date();t.setHours(12,0,0,0);return t};
var fmtCache={};
function parts(d,cal){
  try{
    var f=fmtCache[cal]||(fmtCache[cal]=new Intl.DateTimeFormat('fa-IR-u-ca-'+cal+'-nu-latn',{year:'numeric',month:'numeric',day:'numeric'}));
    var o={};
    f.formatToParts(d).forEach(function(p){if(p.type==='year'||p.type==='month'||p.type==='day')o[p.type]=parseInt(p.value,10)});
    return {y:o.year,m:o.month,d:o.day};
  }catch(e){return {y:NaN,m:NaN,d:NaN}}
}
function monthName(d,cal){return new Intl.DateTimeFormat('fa-IR-u-ca-'+cal,{month:'long'}).format(d)}
function monthFirst(d,cal){return addDays(d,-(parts(d,cal).d-1))}
function monthLen(first,cal){var m=parts(first,cal).m,n=1;while(n<32&&parts(addDays(first,n),cal).m===m)n++;return n}

/* ---------- state ---------- */
var S=null;
var ui={chat:null,wk:null,inst:'',tab:'cal',sel:iso(todayD()),viewFirst:null,foodType:null,rep:null,open:{}};
var EMPTY={type:'none',done:{},w:{},avoid:false,note:''};
function dayOf(id){return S.days[id]||EMPTY}
function ensure(id){return S.days[id]||(S.days[id]={type:'none',done:{},w:{},avoid:false,note:''})}
function defaults(){
  var t=todayD();
  return {v:1,settings:{start:iso(addDays(t,-wdIdx(t))),cal:'persian',rem:defRem()},days:{},weigh:[{id:1,d:iso(t),kg:'76'}]};
}
var pt=null;
function persist(){clearTimeout(pt);pt=setTimeout(function(){Store.save(S);takeSnap()},150)}
function flush(){clearTimeout(pt);if(S){Store.save(S);takeSnap()}}
var cal=function(){return S.settings.cal};
function defRem(){return {on:false,times:{b:'08:00',l:'13:00',pre:'17:00',gym:'18:30',d:'20:30'}}}
function migrate(o){
  if(!o.settings)o.settings={};
  if(!o.settings.rem||!o.settings.rem.times)o.settings.rem=defRem();
  Object.keys(o.days||{}).forEach(function(id){var dd=o.days[id];if(dd.avoid===true)dd.avoid='ok';else if(!dd.avoid)dd.avoid=''});
  if(!o.weigh)o.weigh=[];
  return o;
}
function dlabel(id){return new Intl.DateTimeFormat('fa-IR-u-ca-'+cal(),{day:'numeric',month:'long',year:'numeric'}).format(parse(id))}

/* ---------- program data ---------- */
var PATTERN=['A','L1','B','L2','C','L1','R'];
var WARM={id:'w0',n:'گرم‌کردن روی تردمیل، دوچرخه ثابت یا الپتیکال با شدت کم',s:'10 دقیقه',r:'any'};
var FIN={id:'fin',n:'کاردیو ملایم پایان تمرین (تردمیل شیب‌دار، الپتیکال یا دوچرخه ثابت)',s:'10 تا 15 دقیقه',r:'cardio'};
var PW={id:'pw',n:'پرس پا سبک و سریع',s:'3×6',r:'lower',w:1,t:'پایین آرام، بالا با سرعت کنترل‌شده؛ زانو را کامل قفل نکن'};
var MOB10={id:'mob10',n:'کشش و موبیلیتی',s:'10 دقیقه',r:'any'};
var MOB15={id:'mob',n:'کشش و موبیلیتی بعد از فوتبال',s:'15 دقیقه',r:'any'};
var FLUSH={id:'fl',n:'دوچرخه ثابت یا تردمیل با سرعت خیلی آرام',s:'20 دقیقه',r:'any'};
var SESS={
 A:{n:'تمام‌بدن A (دستگاه)',min:80,items:[WARM,
  {id:'ma1',n:'دستگاه پرس پا',s:'3×10',r:'lower',w:1,t:'پاها به عرض شانه، کمر چسبیده به پشتی، زانو را کامل قفل نکن'},
  {id:'ma2',n:'دستگاه پرس سینه',s:'3×10',r:'upper',w:1,t:'دستگیره هم‌سطح وسط سینه؛ اگر دستگاه شلوغ بود: نیمکت پرس با هالتر'},
  {id:'ma3',n:'دستگاه قایقی',s:'3×10',r:'upper',w:1,t:'سینه به پد، آرنج‌ها را به عقب بکش و کتف‌ها را جمع کن'},
  {id:'ma4',n:'دستگاه پشت ران',s:'3×12',r:'lower',w:1,t:'پشت‌ران برای فوتبال مهم است؛ پایین‌آوردن آرام'},
  {id:'ma5',n:'دستگاه پرس سرشانه',s:'3×10',r:'upper',w:1,t:'صندلی را طوری تنظیم کن که دستگیره‌ها هم‌سطح شانه باشند'},
  {id:'ma8',n:'دستگاه پشت‌بازو دیپ',s:'3×12',r:'upper',w:1,t:'آرنج‌ها نزدیک بدن، دست‌ها را کامل صاف کن'},
  {id:'ma7',n:'دستگاه فیله کمر',s:'3×12',r:'lower',t:'آرام بالا بیا و بیشتر از حالت صاف کمر خم نشو'},FIN]},

function phaseOf(w){
  if(w<1)return {k:0,tip:''};
  if(w<=2)return {k:1,tip:'مرحله 1: وزنه سبک بردار و روی فرم درست تمرکز کن. هر ست را با 2 تکرار ذخیره تمام کن.'};
  if(w<=5)return {k:2,tip:'مرحله 2: وقتی همه ست‌ها به بالاترین تکرار رسید، دفعه بعد 2.5 کیلو اضافه کن.'};
  return {k:3,tip:'مرحله 3: وزنه‌ها را سنگین‌تر کن، پایین‌آوردن را آرام و بالا‌بردن را کنترل‌شده بزن و با 1 تا 2 تکرار ذخیره کار کن.'};
}
function weekOf(d){var st=parse(S.settings.start);return Math.floor(Math.round((d-st)/864e5)/7)+1}
function weekLabel(w){return w<1?'قبل از شروع برنامه':w>8?'بعد از 8 هفته، ادامه مرحله 3':'هفته '+w+' از 8'}
function sessItems(b,ph){
  var a=SESS[b].items.slice();
  if(ph.k>=3&&(b==='A'||b==='B')&&getProf().sport)a.splice(a.length-1,0,PW);
  return a;
}
function planFor(id){
  var d=parse(id),day=dayOf(id),type=day.type,base=PATTERN[wdIdx(d)];
  var next=dayOf(iso(addDays(d,1))).type,prev=dayOf(iso(addDays(d,-1))).type;
  var ph=phaseOf(weekOf(d));
  var strength=!!(SESS[base]&&SESS[base].lift);
  var notes=[],title,min,items,counts=true;
  var lite=function(it){return Object.assign({},it,{s:it.s.replace(/^[34]×/,'2×')})};
  var upperOnly=function(){return sessItems(base,ph).filter(function(it){return it.r==='any'||it.r==='upper'||it.r==='core'}).map(lite)};
  if(type==='rest'){
    title='استراحت کامل';min=30;items=SESS.R.items;counts=false;
    notes.push('این روز را استراحت انتخاب کردی. ریکاوری هم بخشی از پیشرفت است.');
  }else if(type==='match'){
    counts=false;
    if(strength){
      title=SESS[base].n+'، خیلی سبک (روز مسابقه)';min=40;
      items=sessItems(base,ph).filter(function(it){return it.r==='upper'}).slice(0,4).map(function(it){return Object.assign({},it,{s:'2×12'})}).concat([LCI],MATCH);
      notes.push('امروز مسابقه داری، پس باشگاه فقط بالاتنه و خیلی سبک است: 2 ست، وزنه حدود 70 درصد معمول و حداقل 3 تکرار ذخیره.');
      notes.push('اگر بازی عصر است، تمرین سبک را صبح بزن و حداقل 4 ساعت تا بازی فاصله بگذار. اگر بازی صبح است، بعد از بازی و کمی استراحت بزن یا کلاً ردش کن.');
    }else{
      title='روز مسابقه';min=20;items=(base==='L1'||base==='L2')?[LCI].concat(MATCH):MATCH;
      notes.push('امروز مسابقه داری. اگر خواستی فقط یک حرکت شکم سبک با دستگاه بزن و انرژی‌ات را برای بازی نگه دار.');
    }
  }else if(type==='train'){
    if(strength){
      title=SESS[base].n+'، سبک‌شده (روز تمرین فوتبال)';min=40;
      items=sessItems(base,ph).filter(function(it){return it.id==='w0'||it.r==='upper'||LL[it.id]||it.r==='core'}).map(lite);
      if(!items.some(function(it){return it.r==='core'}))items.push(LCI);
      notes.push('امروز تمرین فوتبال داری، پس وزنه سبک‌تر است ولی کار با دستگاه می‌ماند: بالاتنه با حدود 80 درصد وزنه و از پا فقط دستگاه‌های کم‌فشار (پشت‌ران، ادداکتور، ابداکتور، ساق) با حدود 60 درصد.');
      notes.push('پرس پا، هاگ پا و اسمیت امروز نه. هر ست را با حداقل 3 تکرار ذخیره تمام کن. اگر فوتبال عصر است، وزنه را صبح یا بعد از فوتبال بزن، نه درست قبل از آن.');
    }else if(base==='L1'||base==='L2'){
      title='شکم سبک و موبیلیتی (روز تمرین فوتبال)';min=30;counts=false;
      items=[LCI,{id:'lb',n:'نیمکت شکمی',s:'2×12',r:'core'},MOB15];
      notes.push('کاردیو امروز همان فوتبال است. فقط شکم را سبک با دستگاه بزن.');
    }else{
      title='موبیلیتی بعد از فوتبال';min=15;items=[MOB15];counts=false;
      notes.push('امروز روز استراحت است و فوتبال کار را انجام می‌دهد.');
    }
  }else if(next==='match'){
    if(strength){
      title=SESS[base].n+'، قبل از مسابقه';min=40;items=upperOnly();
      notes.push('فردا مسابقه داری. پا سنگین نزن و وزنه را سبک نگه دار.');
    }else if(base==='L2'){
      title='فعال‌سازی قبل از مسابقه';min=25;items=ACT;counts=false;
      notes.push('فردا مسابقه داری. امروز فقط پاها را بیدار کن، خسته نکن.');
    }else{
      title='کاردیو خیلی سبک';min=25;counts=false;
      items=[{id:'l1',n:'کاردیو خیلی سبک',s:'20 دقیقه',r:'any'},MOB10];
      notes.push('فردا مسابقه داری. امروز فقط ریکاوری.');
    }
  }else if(prev==='match'){
    if(strength){
      title=SESS[base].n+'، ریکاوری بعد از مسابقه';min=45;items=upperOnly().concat([FLUSH]);
      notes.push('دیروز مسابقه داشتی. پا را بار نزن، ریکاوری اولویت است.');
    }else{
      title='ریکاوری بعد از مسابقه';min=30;items=[FLUSH,MOB10];counts=false;
      notes.push('دیروز مسابقه داشتی. امروز فقط سبک حرکت کن.');
    }
  }else if(strength){
    title=SESS[base].n;min=SESS[base].min;items=sessItems(base,ph);
    if(ph.tip)notes.push(ph.tip);
  }else if(base==='L2'){
    title='کاردیو متنوع و شکم';min=50;items=cardioItems(ph);
    notes.push('هر دستگاه را با شدت متوسط بزن. اگر پاهایت سنگین بود، زمان هر دستگاه را کم کن.');
  }else if(base==='L1'){
    title=SESS.L1.n;min=SESS.L1.min;items=SESS.L1.items;
  }else{
    title='استراحت کامل';min=30;items=SESS.R.items;counts=false;
    notes.push('روز استراحت هفتگی. ریکاوری هم بخشی از پیشرفت است.');
  }
  return {title:title,min:min,items:items,notes:notes,counts:counts,strength:strength};
}
function foodKey(id){
  var d=parse(id),t=dayOf(id).type;
  if(t==='match')return 'match';
  if(t==='train')return 'train';
  if(t==='rest')return 'rest';
  if(dayOf(iso(addDays(d,1))).type==='match')return 'gym';
  var b=PATTERN[wdIdx(d)];
  return (SESS[b]&&SESS[b].lift)?'gym':'rest';
}

function buildFood(pf,calc){
  var DAYF={gym:1,train:1.05,match:1.12,rest:0.88},out={};
  Object.keys(TPL).forEach(function(k){
    var Tm=TPL[k],base={p:{kc:0,p:0},c:{kc:0,p:0},x:{kc:0,p:0}};
    Tm.meals.forEach(function(m){m[1].forEach(function(it){if(it.alt)return;var q=sumP(it.p);var g=it.g||'x';base[g].kc+=q.kc;base[g].p+=q.p})});
    var a=1,b=1;
    if(!pf.legacy){
      var Kt=calc.kcal*DAYF[k],Pt=calc.p;
      for(var i=0;i<40;i++){
        if(base.p.p>0)b=Math.min(2,Math.max(0.4,(Pt-base.x.p-a*base.c.p)/base.p.p));
        if(base.c.kc>0)a=Math.min(2.2,Math.max(0.4,(Kt-base.x.kc-b*base.p.kc)/base.c.kc));
      }
    }
    var T={kc:0,p:0,c:0,f:0};
    var meals=Tm.meals.map(function(m){
      var t={kc:0,p:0,c:0,f:0},main=[],alt=[];
      var its=m[1].map(function(src){
        var it={t:src.t,p:src.p,alt:src.alt};
        if(src.o&&src.o.st&&!src.alt){
          var sc=src.g==='p'?b:src.g==='c'?a:1,o=src.o,q=Math.round(src.q*sc/o.st)*o.st;
          q=Math.min(o.mx||src.q*3,Math.max(o.mn||o.st,q));
          if(pf.legacy)q=src.q;
          it.p=[[src.p[0][0],q]];
          it.t=src.t.replace('{n}',fmtN(q*(o.m||1)));
        }else it.t=src.t.replace('{n}',fmtN(src.q||1));
        it.s=sumP(it.p);
        if(it.alt)alt.push(it.t);
        else{t.kc+=it.s.kc;t.p+=it.s.p;t.c+=it.s.c;t.f+=it.s.f;main.push(it.t)}
        return it;
      });
      T.kc+=t.kc;T.p+=t.p;T.c+=t.c;T.f+=t.f;
      var txt=main.join('، ')+(alt.length?'؛ '+alt.join('؛ '):'');
      var tot=t.kc>0?'حدود '+Math.round(t.kc/10)*10+' کیلوکالری، '+fmt(t.p)+' گرم پروتئین':'بدون کالری';
      return [m[0],txt,its,tot];
    });
    var lo=Math.round((pf.w*0.033+0.2)*2)/2+((k==='train'||k==='match')?0.5:0);
    var water=pf.legacy?(k==='gym'?'2.5 تا 3 لیتر':k==='rest'?'2.5 لیتر':'3 لیتر یا بیشتر'):(lo+' تا '+(lo+0.5)+' لیتر');
    out[k]={n:Tm.n,kcal:Math.round(T.kc/10)*10,p:Math.round(T.p),c:Math.round(T.c),f:Math.round(T.f),water:water,meals:meals};
  });
  FOOD=out;
}

function lastLog(itemId,id){
  var ks=Object.keys(S.days).sort().reverse();
  for(var i=0;i<ks.length;i++){
    var dd=S.days[ks[i]];
    if(ks[i]<id&&dd.type!=='match'&&dd.type!=='train'&&(weekOf(parse(ks[i]))%4!==0)&&dd.w&&dd.w[itemId]){var n=parseFloat(norm(dd.w[itemId]));if(n>0)return {w:n,done:!!dd.done[itemId]}}
  }

function rnd(x){return Math.max(0,Math.round(x*2)/2)}
function sugBase(itemId,id){
  var st=startW(itemId),step=STEP[itemId]||2.5,wk=weekOf(parse(id)),ph=phaseOf(wk),last=lastLog(itemId,id);
  if(last){
    if(last.done&&ph.k>=2)return {kg:rnd(last.w+step),step:Math.abs(step),kind:'up'};
    return {kg:rnd(last.w),step:0,kind:'same',why:last.done?'هنوز مرحله فرم است، همین وزن را تکرار کن':'دفعه قبل کامل نشد، همین وزن را تکرار کن'};
  }
  var n=wk<=2?0:Math.min(wk-2,4);
  if(n>0)return {kg:rnd(st+step*n),step:Math.abs(step*n),kind:'plan'};
  return {kg:rnd(st),step:0,kind:'start',why:'شروع سبک؛ ست آخر باید 2 تکرار ذخیره داشته باشی'};
}
function sugFor(itemId,id){

    xr[c]=pos;w(c+' 0 obj\n<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');

function nz(t){
  return String(t).replace(/[يى]/g,'ی').replace(/ك/g,'ک').replace(/[\u200c\u200d]/g,' ').replace(/[ـًٌٍَُِّْ]/g,'')
    .replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)}).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
    .toLowerCase().replace(/[؟?!.,،:;()«»"'\-\/\\+*]/g,' ').replace(/\s+/g,' ').trim();
}
function rxe(x){return x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}

function numTok(t){if(/^\d+(\.\d+)?$/.test(t))return parseFloat(t);return NUMW.hasOwnProperty(t)?NUMW[t]:null}
function qtyAt(s0,start,end,d){
  var before=s0.slice(0,start).trim().split(' ').filter(Boolean),i=before.length-1,unit=null,val=null,cnt=0;
  while(i>=0&&cnt<4){
    var t=before[i];
    if(t==='گرم'||t==='گرمی'){unit='g';i--;cnt++;continue}
    if(UNITW[t]){i--;cnt++;continue}
    var n=numTok(t);
    if(n!==null){
      val=n;
      if(t==='نیم'&&before[i-1]==='و'&&numTok(before[i-2]||'')!==null)val=numTok(before[i-2])+0.5;
      break;
    }
    break;
  }
  if(val===null){
    var after=s0.slice(end).trim().split(' ').filter(Boolean);
    var n2=numTok(after[0]||'');
    if(n2!==null&&(after[1]==='گرم'||after[1]==='گرمی')){val=n2;unit='g'}
  }
  if(val===null)return 1;
  var q=unit==='g'?val/(d.g||100):val;

}
function matchFoods(q){

    s=s.slice(0,st)+new Array(en-st+1).join(' ')+s.slice(en);
  });
  found.sort(function(a,b){return a.pos-b.pos});
  return found.slice(0,4);
}

var PROF_DEF={sex:'m',age:25,h:177,w:76,goal:'fatloss',level:'beginner',days:3,sport:true,legacy:true,saved:false};

var GL={fatloss:'کم‌کردن چربی',muscle:'افزایش حجم عضله',strength:'افزایش قدرت',fitness:'تناسب اندام و سلامت'};
function parseGoal(t){
  var n=nz(t);
  if(/چربی|لاغر|کاهش وزن|کم کردن وزن|شکم|چاق|وزن کم/.test(n))return 'fatloss';
  if(/حجم|عضله|حجیم|بزرگ|ماس|پروار/.test(n))return 'muscle';
  if(/قدرت|زور|قوی/.test(n))return 'strength';
  if(/تناسب|سلامت|فیت|سالم|تندرست|انعطاف|حفظ/.test(n))return 'fitness';
  return null;
}
function calcPlan(pf){
  var w=pf.w,h=pf.h,a=pf.age,m=pf.sex==='m',warns=[],goal=pf.goal;
  var bmr=10*w+6.25*h-5*a+(m?5:-161);
  var act=pf.days<=3?1.4:pf.days===4?1.5:1.55;if(pf.sport)act+=0.05;
  var tdee=bmr*act,bmi=w/Math.pow(h/100,2);
  if(bmi<18.5&&goal==='fatloss'){goal='fitness';warns.push('وزن تو نسبت به قدت پایین است، پس کم‌کردن وزن توصیه نمی‌شود و هدف را روی «تناسب و سلامت» گذاشتم. اگر نگران وزنت هستی با پزشک مشورت کن.')}
  if(a<18){if(goal==='fatloss')goal='fitness';warns.push('زیر 18 سال هستی: وزنه‌ها را سبک نگه دار، فرم درست را اولویت بده و بهتر است زیر نظر مربی یا والدین تمرین کنی. رژیم کاهش وزن توصیه نمی‌شود.')}
  var kcal;
  if(goal==='fatloss'){kcal=Math.max(tdee*0.8,m?1500:1200);kcal=Math.min(kcal,tdee*0.95)}
  else if(goal==='muscle')kcal=tdee*(a<18?1.05:1.08);
  else if(goal==='strength')kcal=tdee*1.05;
  else kcal=tdee;
  kcal=Math.round(kcal/10)*10;
  var ideal=24*Math.pow(h/100,2),pref=bmi>30?ideal+0.25*(w-ideal):w;
  var perkg={fatloss:2,muscle:1.8,strength:1.8,fitness:1.6}[goal];
  var p=Math.round(Math.min(pref*perkg,w*2.2));
  var f=Math.round(Math.max(kcal*0.25/9,pref*0.6));
  var c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  if(bmi>=35)warns.push('شاخص توده بدنی تو بالاست (BMI '+(Math.round(bmi*10)/10)+'). قبل از شروع تمرین سنگین با پزشک مشورت کن و از وزنه‌ی سبک شروع کن.');
  if(a>=55)warns.push('بالای 55 سال هستی: گرم‌کردن را کامل انجام بده، وزنه را آرام بالا ببر و در صورت داشتن بیماری قلبی یا فشار خون با پزشک مشورت کن.');
  warns.push('این برنامه جای پزشک نیست. در صورت بیماری، بارداری، آسیب‌دیدگی یا مصرف دارو قبل از شروع با پزشک مشورت کن.');
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal:kcal,p:p,c:c,f:f,bmi:Math.round(bmi*10)/10,goal:goal,warns:warns};
}

function patternFor(pf,goal){
  var d=pf.days,cut=goal==='fatloss',fit=goal==='fitness';
  if(d===3)return cut?['A','L1','B','L2','C','L1','R']:fit?['A','L1','B','R','C','L1','R']:['A','R','B','R','C','R','R'];
  if(d===4)return cut?['UA','LA','L1','UB','LB','L2','R']:fit?['UA','LA','R','UB','LB','L1','R']:['UA','LA','R','UB','LB','R','R'];
  return ['UA','LA','R','UB','LB','A','R'];
}
function buildProgram(pf,cp){
  var g=cp.goal,strip=(g==='muscle'||g==='strength'),out={};
  Object.keys(BASE_SESS).forEach(function(k){
    var b=BASE_SESS[k],items=b.items.filter(function(it){return !(strip&&it.id==='fin')}).map(function(it){
      var x=Object.assign({},it);
      if(x.w&&k!=='L1'){
        var cm=!!CMP[x.id];
        if(g==='strength')x.s=cm?'4×5':'3×8';
        else if(g==='muscle')x.s=cm?'4×8':x.s;
        else if(g==='fitness')x.s=x.s.replace(/^\d×\d+/,'3×12');
      }
      return x;
    });
    if(pf.sex==='f'&&!pf.legacy){
      var ins=k==='A'?ci('mb4'):k==='B'?ci('mc13'):null;
      if(ins&&!items.some(function(it){return it.id===ins.id})){var at=items.length&&items[items.length-1].id==='fin'?items.length-1:items.length;items.splice(at,0,ins)}
    }
    out[k]={n:b.n,min:b.min,lift:b.lift,items:items};
    items.forEach(function(it){RMAP[it.id]=it.r});
  });
  SESS=out;

function startW(id){
  var base=START[id]||0;if(!base)return 0;
  var pf=getProf();if(pf.legacy)return base;
  var r=RMAP[id]||'upper',m=pf.sex==='f',lv={beginner:1,intermediate:1.35,advanced:1.7}[pf.level]||1;
  var ag=pf.age<18?0.8:pf.age>=55?0.8:pf.age>=45?0.9:1,x;
  if(id==='mc3')x=base*(pf.w/76)*(m?1.2:1)*ag/lv;
  else x=base*(pf.w/76)*(m?(r==='lower'?0.7:0.55):1)*lv*ag;

var SND=[['default','صدای خود گوشی'],['chime','زنگوله'],['bell','زنگ'],['beep','بوق'],['drum','طبل'],['soft','ملایم'],['whistle','سوت داور'],['off','بی‌صدا']];
var AC=null;
function playTone(name){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C||name==='off'||name==='default')return;
    if(!AC)AC=new C();
    if(AC.state==='suspended')AC.resume();
    var t0=AC.currentTime+0.03;
    var note=function(f,st,du,ty,g,f2){
      var o=AC.createOscillator(),ga=AC.createGain();
      o.type=ty||'sine';o.frequency.setValueAtTime(f,t0+st);
      if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+st+du);
      ga.gain.setValueAtTime(0.0001,t0+st);
      ga.gain.exponentialRampToValueAtTime(g||0.3,t0+st+0.02);
      ga.gain.exponentialRampToValueAtTime(0.0001,t0+st+du);
      o.connect(ga);ga.connect(AC.destination);o.start(t0+st);o.stop(t0+st+du+0.05);
    };
    if(name==='chime'){note(880,0,.35);note(1175,.2,.55)}
    else if(name==='bell'){note(660,0,1.4,'sine',.35);note(1320,0,1,'sine',.15);note(1980,0,.6,'sine',.08)}
    else if(name==='beep'){for(var i=0;i<3;i++)note(900,i*.22,.14,'square',.12)}
    else if(name==='drum'){note(180,0,.35,'sine',.6,45);note(180,.3,.35,'sine',.6,45)}
    else if(name==='soft'){note(523,0,.5);note(659,.25,.5);note(784,.5,.8)}
    else if(name==='whistle'){
      [0,.55].forEach(function(st,k){
        var o=AC.createOscillator(),lf=AC.createOscillator(),lg=AC.createGain(),ga=AC.createGain(),du=k?.7:.4;
        o.type='sine';o.frequency.value=2900;lf.frequency.value=38;lg.gain.value=140;
        lf.connect(lg);lg.connect(o.frequency);
        ga.gain.setValueAtTime(0.0001,t0+st);ga.gain.exponentialRampToValueAtTime(.22,t0+st+.03);ga.gain.setValueAtTime(.22,t0+st+du-.08);ga.gain.exponentialRampToValueAtTime(0.0001,t0+st+du);
        o.connect(ga);ga.connect(AC.destination);o.start(t0+st);lf.start(t0+st);o.stop(t0+st+du+.05);lf.stop(t0+st+du+.05);
      });
    }
  }catch(e){}
}

function mealText(key,slot){
  var ms=FOOD[key].meals,i,nm;
  if(slot==='pre')for(i=0;i<ms.length;i++){if(ms[i][0].indexOf('قبل از')>=0&&ms[i][0].indexOf('بازی')<0)return ms[i][1]}
  for(i=0;i<ms.length;i++){
    nm=ms[i][0];
    if(slot==='b'&&nm.indexOf('صبحانه')===0)return ms[i][1];
    if(slot==='l'&&(nm.indexOf('ناهار')===0||nm==='3 ساعت قبل'))return ms[i][1];
    if(slot==='d'&&nm.indexOf('شام')===0)return ms[i][1];
    if(slot==='pre'&&(nm.indexOf('قبل')>=0||nm==='میان‌وعده')&&nm.indexOf('بازی')<0||(slot==='pre'&&nm.indexOf('45')===0))return ms[i][1];
  }
  return 'برنامه غذایی امروز را در برنامه ببین';
}
function remFor(id,slot){
  var pl=planFor(id),k=foodKey(id);
  if(slot==='gym'){
    var dsc=pl.items.map(function(it){var t=it.n;if(it.w&&pl.strength){var g=sugFor(it.id,id);t+=' '+g.kg+' کیلو'+((g.kind==='up'||g.kind==='plan')?' (سنگین‌تر)':'')}return t}).join(' ، ');
    return {t:'وقت تمرین: '+pl.title,b:dsc};
  }
  return {t:'وقت '+SLOT[slot],b:mealText(k,slot)};
}
function notify(title,body,tag){
  var snd=(S&&S.settings&&S.settings.rem&&S.settings.rem.sound)||'default';
  var opt={body:body,tag:tag||'fb',lang:'fa',dir:'rtl',icon:'icon-192.png',vibrate:[200,100,200]};
  if(snd==='off')opt.silent=true;
  else if(snd!=='default'&&!document.hidden){opt.silent=true;playTone(snd)}
  try{
    if(!('Notification' in window)||Notification.permission!=='granted'){toast(title);return}
    if(navigator.serviceWorker&&navigator.serviceWorker.ready&&/^https?:/.test(location.protocol)){navigator.serviceWorker.ready.then(function(r){r.showNotification(title,opt)}).catch(function(){new Notification(title,opt)})}
    else new Notification(title,opt);
  }catch(e){toast(title)}
}

function tick(force){
  if(!S||!S.settings.rem.on)return;
  var n=new Date(),hm=pad(n.getHours())+':'+pad(n.getMinutes()),day=iso(n),T=S.settings.rem.times;
  Object.keys(T).forEach(function(k){
    var fk=day+k;
    if(fired[fk])return;
    var diff=(n.getHours()*60+n.getMinutes())-(parseInt(T[k].slice(0,2),10)*60+parseInt(T[k].slice(3),10));
    if(diff>=0&&diff<=(force?15:1)){fired[fk]=1;var m=remFor(iso(todayD()),k);notify(m.t,m.b,fk)}
  });
}

function icsEsc(t){return String(t).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
function icsLine(l){var o=[],i=0;while(l.length-i>30){o.push(l.slice(i,i+30));i+=30}o.push(l.slice(i));return o.join('\r\n ')}
function buildIcs(){
  var T=S.settings.rem.times,L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//fbgym//FA','CALSCALE:GREGORIAN','X-WR-CALNAME:یادآوری فوتبال و باشگاه'],t0=todayD(),stamp=iso(t0).replace(/-/g,'')+'T000000Z';
  for(var i=0;i<56;i++){
    var id=iso(addDays(t0,i)),dd=dayOf(id),pl=planFor(id),ds=id.replace(/-/g,'');
    Object.keys(T).forEach(function(k){
      if(k==='gym'&&dd.type==='rest')return;
      if(k==='gym'&&dd.type==='none'&&!pl.counts&&pl.title==='استراحت کامل')return;
      var m=remFor(id,k),hh=parseInt(T[k].slice(0,2),10),mm=parseInt(T[k].slice(3),10),e=hh*60+mm+30;
      var st=ds+'T'+pad(hh)+pad(mm)+'00',en=ds+'T'+pad(Math.min(23,Math.floor(e/60)))+pad(e>=1440?59:e%60)+'00';
      [ 'BEGIN:VEVENT','UID:fbgym-'+ds+'-'+k+'@local','DTSTAMP:'+stamp,'DTSTART:'+st,'DTEND:'+en,'SUMMARY:'+icsEsc(m.t),'DESCRIPTION:'+icsEsc(m.b),'BEGIN:VALARM','TRIGGER:PT0M','ACTION:DISPLAY','DESCRIPTION:'+icsEsc(m.t),'END:VALARM','END:VEVENT'].forEach(function(x){L.push(icsLine(x))});
    });
  }
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

    var dd=ensure(ui.sel);dd.type=(dd.type===v&&v!=='none')?'none':v;persist();render();window.scrollTo(0,y);
    toast(dd.type==='none'?'برنامه به حالت عادی برگشت':'برنامه باشگاه با این روز هماهنگ شد');
  }
  else if(a==='done'){var d2=ensure(ui.sel);d2.done[el.dataset.id]=!d2.done[el.dataset.id];persist();render();window.scrollTo(0,y)}
  else if(a==='avoid'){var d3=ensure(ui.sel);d3.avoid=(d3.avoid===v)?'':v;persist();render();window.scrollTo(0,y)}
  else if(a==='food'){ui.tab='food';ui.foodType=v;render();window.scrollTo(0,0)}
  else if(a==='ftype'){ui.foodType=v;render();window.scrollTo(0,y)}
  else if(a==='addw'){
    var kg=parseFloat(norm(document.getElementById('wkg').value)),dt=document.getElementById('wd').value;
    if(!(kg>20&&kg<300)||!dt){toast('وزن را درست وارد کن، مثلاً 75.5');return}
    S.weigh.push({id:Date.now(),d:dt,kg:String(kg)});persist();render();window.scrollTo(0,y);toast('وزن ثبت شد');
  }
  else if(a==='delw'){S.weigh=S.weigh.filter(function(x){return String(x.id)!==v});persist();render();window.scrollTo(0,y)}
  else if(a==='cal'){S.settings.cal=v;ui.viewFirst=monthFirst(parse(ui.sel),v);persist();render();window.scrollTo(0,y)}
  else if(a==='export'){
    var blob=new Blob([JSON.stringify(S)],{type:'application/json'}),l=document.createElement('a');
    l.href=URL.createObjectURL(blob);l.download='football-gym-backup.json';document.body.appendChild(l);l.click();l.remove();S.settings.lastBackup=iso(todayD());persist();render();window.scrollTo(0,y);toast('فایل پشتیبان ساخته شد');
  }
  else if(a==='usew'){ensure(ui.sel).w[el.dataset.id]=v;persist();render();window.scrollTo(0,y)}
  else if(a==='notif'){
    var R2=S.settings.rem;
    if(R2.on){R2.on=false;persist();render();window.scrollTo(0,y);toast('اعلان خاموش شد')}
    else if(!('Notification' in window)){toast('این مرورگر اعلان را پشتیبانی نمی‌کند، فایل تقویم را بگیر')}
    else Notification.requestPermission().then(function(pm){
      if(pm==='granted'){R2.on=true;persist();render();window.scrollTo(0,y);toast('اعلان روشن شد')}
      else toast('اجازه اعلان داده نشد. از تنظیمات مرورگر اجازه بده یا فایل تقویم را بگیر');
    });
  }
  else if(a==='snd'){S.settings.rem.sound=v;persist();playTone(v);render();window.scrollTo(0,y)}
  else if(a==='rtest'){var rm=remFor(iso(todayD()),'gym');notify(rm.t,rm.b,'test')}
  else if(a==='ics'){
    var bl=new Blob([buildIcs()],{type:'text/calendar;charset=utf-8'}),l2=document.createElement('a');
    l2.href=URL.createObjectURL(bl);l2.download='football-gym-reminders.ics';document.body.appendChild(l2);l2.click();l2.remove();toast('فایل تقویم ساخته شد، بازش کن');
  }
  else if(a==='import'){document.getElementById('file').click()}
  else if(a==='img'){ui.open[el.dataset.id]=!ui.open[el.dataset.id];render();window.scrollTo(0,y)}
  else if(a==='rprev'){ui.rep=monthFirst(addDays(ui.rep,-1),cal());render()}
  else if(a==='rnext'){ui.rep=addDays(ui.rep,monthLen(ui.rep,cal()));render()}
  else if(a==='gorep'){ui.rep=monthFirst(todayD(),cal());ui.tab='prog';render();window.scrollTo(0,0)}
  else if(a==='copyrep'||a==='sharerep'){
    var txt=repText(ui.rep);
    if(a==='sharerep'&&navigator.share){navigator.share({text:txt}).catch(function(){})}
    else{
      var done=function(){toast('گزارش کپی شد')};
      if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,function(){toast('کپی نشد')})}
      else{var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(x){toast('کپی نشد')}ta.remove()}
    }
  }
  else if(a==='snap'){
    var sn=snaps[parseInt(v,10)];
    if(sn&&confirm('اطلاعات فعلی با این نسخه جایگزین شود؟ نسخه فعلی هم نگه داشته می‌شود.')){
      try{
        var restored=migrate(Object.assign(defaults(),JSON.parse(sn.json)));
        snaps.push({d:iso(todayD()),json:JSON.stringify(S),tag:'قبل از بازیابی'});snaps=snaps.slice(-8);
        S=restored;flush();ui.viewFirst=monthFirst(parse(ui.sel),cal());ui.rep=monthFirst(todayD(),cal());render();window.scrollTo(0,y);toast('نسخه بازیابی شد');
      }catch(x){toast('بازیابی نشد')}
    }
  }
  else if(a==='reset'){
    if(confirm('همه اطلاعات پاک شود؟ این کار برگشت ندارد.')){S=defaults();ui.sel=iso(todayD());ui.viewFirst=monthFirst(todayD(),cal());ui.rep=monthFirst(todayD(),cal());flush();render();toast('همه چیز پاک شد')}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;if(!S||!t.dataset)return;
  if(t.dataset.act==='wt'){ensure(ui.sel).w[t.dataset.id]=norm(t.value);persist()}
  else if(t.dataset.act==='note'){ensure(ui.sel).note=t.value;persist()}
});
document.addEventListener('change',function(e){
  var t=e.target;if(!S||!t.dataset)return;
  if(t.dataset.act==='pfin'){if(!ui.pf)ui.pf=Object.assign({},getProf());var nv=parseFloat(norm(t.value));ui.pf[t.dataset.k]=isNaN(nv)?'':nv}
  else if(t.dataset.act==='pftext'){if(!ui.pf)ui.pf=Object.assign({},getProf());ui.pf.goalText=t.value}
  else if(t.dataset.act==='rt'&&t.value){S.settings.rem.times[t.dataset.v]=t.value;persist();toast('ساعت یادآوری ذخیره شد')}
  else if(t.dataset.act==='start'&&t.value){S.settings.start=t.value;persist();render();toast('تاریخ شروع ذخیره شد')}
  else if(t.dataset.act==='file'&&t.files&&t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      try{
        var o=JSON.parse(fr.result);
        if(!o||!o.days||!o.settings)throw 0;
        S=migrate(Object.assign(defaults(),o));flush();ui.viewFirst=monthFirst(parse(ui.sel),cal());ui.rep=monthFirst(todayD(),cal());render();toast('اطلاعات بازیابی شد');
      }catch(x){toast('فایل پشتیبان معتبر نیست')}
    };
    fr.readAsText(t.files[0]);t.value='';
  }
});
document.addEventListener('visibilitychange',function(){if(document.hidden)flush()});
window.addEventListener('pagehide',flush);

/* ---------- init ---------- */
(async function(){
  var s=await Store.load();
  snaps=(await kget(SNAPK))||[];
  S=migrate((s&&s.days&&s.settings)?Object.assign(defaults(),s):defaults());
  if(isNaN(parts(todayD(),S.settings.cal).y))S.settings.cal='gregory';
  ui.viewFirst=monthFirst(parse(ui.sel),S.settings.cal);
  ui.rep=monthFirst(todayD(),S.settings.cal);
  ui.wk=addDays(todayD(),-wdIdx(todayD()));
  ui.exp=monthFirst(todayD(),S.settings.cal);
  render();
})();
})();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
